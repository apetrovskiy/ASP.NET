# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: ASP.NET Core HW 02 for lesson 02

on:
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

env:
  WORK_DIR: Homeworks/Base
  SOLUTION_FILE: src/PromoCodeFactory.sln
  MAIN_PROJECT: src/PromoCodeFactory.WebHost/PromoCodeFactory.WebHost.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Installing netcat
        run: sudo apt update && sudo apt install netcat-openbsd
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Checking code
        run: |
          cd "${WORK_DIR}"
          dotnet format --verify-no-changes -v d "${SOLUTION_FILE}"
      - name: Restore dependencies
        run: |
          cd "${WORK_DIR}"
          dotnet restore "${SOLUTION_FILE}"
      - name: Build
        run: |
          cd "${WORK_DIR}"
          dotnet build --no-restore "${SOLUTION_FILE}"
      - name: Running the service
        run: |
          cd "${WORK_DIR}"
          dotnet ru n --project "${MAIN_PROJECT}"
      - name: Test
        run: |
          cd "${WORK_DIR}"
          # dotnet test --no-build --verbosity normal
          nc localhost 5000 < tests/requests.http
